version: 2

builds:
  - main: ./cmd/readability
    binary: readability
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Sign and notarize darwin binaries using the keychain, before archiving.
    hooks:
      post:
        - cmd: sh scripts/macos-sign.sh {{ .Os }} {{ .Path }} {{ .IsSnapshot }}
          output: true

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

homebrew_casks:
  - repository:
      owner: inkcheck
      name: homebrew-tap
    homepage: https://github.com/inkcheck/readability
    description: Readability metrics for text analysis

changelog:
  sort: asc
